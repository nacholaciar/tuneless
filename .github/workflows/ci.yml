name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
      - run: .build/release/tuneless --version
      - run: plutil -lint LaunchAgent/io.github.nacholaciar.tuneless.plist
      - run: sh -n Scripts/install.sh && sh -n Scripts/uninstall.sh
