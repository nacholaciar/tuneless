<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-50 -50 512 512" role="img" aria-label="Tuneless icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9B9C0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4A50"/>
      <stop offset="0.55" stop-color="#141416"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="strike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A6B"/>
      <stop offset="1" stop-color="#F2512F"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="412" height="412" rx="92" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="2" y="2" width="408" height="408" rx="90" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g filter="url(#lift)">
    <g fill="url(#ink)">
      <ellipse cx="168" cy="278" rx="54" ry="40" transform="rotate(-22 168 278)"/>
      <rect x="207" y="96" width="19" height="182" rx="5"/>
      <path d="M216 96 C 254 114, 298 138, 290 206 C 281 177, 254 160, 216 154 Z"/>
    </g>
    <ellipse cx="150" cy="262" rx="20" ry="9" transform="rotate(-22 150 262)" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="210" y="102" width="4" height="150" rx="2" fill="#FFFFFF" fill-opacity="0.22"/>
  </g>
  <line x1="102" y1="102" x2="310" y2="310" stroke="#F7F7F9" stroke-width="46" stroke-linecap="round"/>
  <g filter="url(#lift)">
    <line x1="102" y1="102" x2="310" y2="310" stroke="url(#strike)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
