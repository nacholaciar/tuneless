<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tuneless social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#666}a:hover{color:#333}
</style>
</head>
<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; padding: 96px 112px; background: #16161A; display: flex; align-items: center; gap: 88px; font-family: Inter, system-ui, sans-serif; color: #F4F1EA">
<svg width="300" height="300" viewBox="0 0 412 412" style="flex: none" aria-hidden="true">
<defs>
<linearGradient id="stile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#E4E4E8"></stop></linearGradient>
<linearGradient id="srim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#B9B9C0" stop-opacity="0.6"></stop></linearGradient>
<linearGradient id="sink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A4A50"></stop><stop offset="0.55" stop-color="#141416"></stop><stop offset="1" stop-color="#050506"></stop></linearGradient>
<linearGradient id="sstrike" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A6B"></stop><stop offset="1" stop-color="#F2512F"></stop></linearGradient>
<filter id="slift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"></feDropShadow></filter>
</defs>
<rect x="0" y="0" width="412" height="412" rx="92" fill="url(#stile)"></rect>
<rect x="2" y="2" width="408" height="408" rx="90" fill="none" stroke="url(#srim)" stroke-width="4"></rect>
<g filter="url(#slift)">
<g fill="url(#sink)">
<ellipse cx="168" cy="278" rx="54" ry="40" transform="rotate(-22 168 278)"></ellipse>
<rect x="207" y="96" width="19" height="182" rx="5"></rect>
<path d="M216 96 C 254 114, 298 138, 290 206 C 281 177, 254 160, 216 154 Z"></path>
</g>
<ellipse cx="150" cy="262" rx="20" ry="9" transform="rotate(-22 150 262)" fill="#FFFFFF" fill-opacity="0.28"></ellipse>
<rect x="210" y="102" width="4" height="150" rx="2" fill="#FFFFFF" fill-opacity="0.22"></rect>
</g>
<line x1="102" y1="102" x2="310" y2="310" stroke="#F7F7F9" stroke-width="46" stroke-linecap="round"></line>
<g filter="url(#slift)">
<line x1="102" y1="102" x2="310" y2="310" stroke="url(#sstrike)" stroke-width="24" stroke-linecap="round"></line>
</g>
</svg>
<div style="display: flex; flex-direction: column; gap: 28px; min-width: 0">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -3px">Tuneless</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.3; color: #C9C5BC; max-width: 640px">Stop Apple Music from opening when your AirPods or headphones connect.</p>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
<code style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; color: #F4F1EA; background: #232329; border-radius: 12px; padding: 16px 22px; align-self: flex-start">brew install nacholaciar/tap/tuneless</code>
<span style="font-size: 20px; color: #A8A49B">macOS 14+ · Swift 6 · no UI · media keys keep working · MIT</span>
</div>
</div>
</div>
</body>
</html>
